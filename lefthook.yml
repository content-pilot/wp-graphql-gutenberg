# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: false
  commands:
    phpcbf:
      glob: "*.php"
      run: ./vendor/bin/phpcbf --standard=phpcs.xml {staged_files}
    phpcs:
      glob: "*.php"
      run: ./vendor/bin/phpcs --standard=phpcs.xml {staged_files}

pre-push:
  commands:
    phpunit:
      run: composer run test
