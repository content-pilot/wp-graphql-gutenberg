name: Test Suite

on:
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpunit:
        name: ${{ matrix.php.name }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php:
                    - { name: 'PHP 8.2', version: '8.2' }
                    - { name: 'PHP 8.4', version: '8.4' }
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set PHP version
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php.version }}
                  coverage: none

            - name: Cache Composer dependencies
              id: cache-vendor
              uses: actions/cache@v5
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php.version }}-composer-${{ hashFiles('**/composer.lock') }}

            - name: Maybe install Composer dependencies
              if: steps.cache-vendor.outputs.cache-hit != 'true'
              run: composer install --no-interaction --no-progress

            # A cache hit skips composer install, leaving an autoloader that may predate new classes.
            - name: Refresh Composer autoloader
              run: composer dump-autoload

            - name: Run PHPUnit tests
              run: composer run test
